spring:
  application:
    name: cashCombine
  datasource:
    url: "jdbc:sqlite:${CASHCOMBINE_DB:./cashcombine.db}"
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update

search:
  ai:
    # Local only by default. Point at another host only when it is your own machine
    # (e.g. http://ollama:11434 under Docker Compose).
    base-url: "http://127.0.0.1:11434"
    model: "llama3"
    # Start `ollama serve` on demand. Set false when Ollama runs separately (Compose, system service).
    start-ollama: true
  expander:
    # Optional local-model fallback for searches that find nothing. Off by default so the app
    # behaves identically with no model running.
    enabled: false
    base-url: "http://localhost:11434/v1"
    model: "llama3.1:8b"
    timeout-ms: 3000