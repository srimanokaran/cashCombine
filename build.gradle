plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.hibernate.orm:hibernate-community-dialects'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.xerial:sqlite-jdbc'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.assertj:assertj-core'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Unit tests: everything except *IntegrationTest
tasks.register('unitTest', Test) {
	description = 'Runs unit tests (excludes *IntegrationTest)'
	group = 'verification'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		excludeTestsMatching '*IntegrationTest'
	}
	shouldRunAfter(tasks.named('testClasses'))
}

// Integration / flow tests: *IntegrationTest only
tasks.register('integrationTest', Test) {
	description = 'Runs integration tests (*IntegrationTest)'
	group = 'verification'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter {
		includeTestsMatching '*IntegrationTest'
	}
	shouldRunAfter(tasks.named('testClasses'))
}

// Print each test result in the terminal for all Test tasks
tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed', 'standard_out', 'standard_error'
		exceptionFormat 'full'
		showExceptions true
		showCauses true
		showStackTraces true
		displayGranularity 2
	}
	afterSuite { desc, result ->
		if (!desc.parent) {
			println "\nTest result: ${result.resultType} " +
					"(${result.testCount} tests, " +
					"${result.successfulTestCount} passed, " +
					"${result.failedTestCount} failed, " +
					"${result.skippedTestCount} skipped)"
		}
	}
}
